<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>雑誌最新号</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      font-family: sans-serif;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .magazines {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .magazine {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .magazine img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 10px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .magazines {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 雑誌最新号</h1>
</header>

<div class="container">

  <div id="status" class="status">
    表紙を取得中...
  </div>

  <div id="magazines" class="magazines"></div>

</div>

<script>
async function loadMagazine() {

  const status = document.getElementById("status");
  const magazines = document.getElementById("magazines");

  try {

    const response = await fetch("/api/magazine");
    const data = await response.json();

    if (!data.success || !data.images.length) {
      throw new Error("表紙が見つかりませんでした");
    }

    status.style.display = "none";

    const imageUrl = data.images[0];

    magazines.innerHTML = `
      <div class="magazine">

        <a
          href="https://www.akitashoten.co.jp/yc-retsu"
          target="_blank"
        >
          <img
            src="${imageUrl}"
            alt="ヤングチャンピオン烈"
          >
        </a>

        <div class="info">
          <div class="name">
            ヤングチャンピオン烈
          </div>

          <div>
            最新号
          </div>
        </div>

      </div>
    `;

  } catch (error) {

    status.textContent =
      "表紙の取得に失敗しました：" + error.message;

  }
}

loadMagazine();
</script>

</body>
</html>
